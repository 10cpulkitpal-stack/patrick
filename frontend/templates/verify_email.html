<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify email — Patrick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
<main class="auth-page-card">
  <div class="auth-avatar">P</div>
  <h1>Verify your email</h1>
  <p class="auth-subtitle">Confirm this email address to finish creating your Patrick account.</p>
  <form method="post" action="{{ url_for('verify_email') }}">
    <input type="hidden" name="token" value="{{ token }}">
    <button type="submit">Verify email</button>
  </form>
</main>
</body>
</html>
