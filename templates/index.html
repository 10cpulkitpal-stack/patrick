<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrick — AI Chat Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.5/lib/marked.umd.js" integrity="sha384-ZD0fTOwPMHi7zM6WTVIWJR21I07lq0ccnqz3J6WMvQKG9thh4y7TA1QE6PJu0Af8" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.8/dist/purify.min.js" integrity="sha384-jrsBdrv4eDpEYIq32u13DPbvB6tRmqIDnA6UlgFBoexpetaiWi7g/VbfMEL1WVen" crossorigin="anonymous"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button id="sidebarBrand" class="sidebar-brand" title="Toggle sidebar" aria-label="Toggle sidebar">P</button>
      <button id="sidebarToggle" class="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
    <div class="sidebar-actions">
      <button id="newChatBtn" class="new-chat-btn" title="New chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>New chat</span>
      </button>
      <button type="button" id="sidebarHistoryBtn" class="sidebar-action" title="Show chat history" aria-label="Show chat history">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 6v14M8 7h8M8 11h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="account-footer">
      <button type="button" class="account-button" id="accountButton" aria-haspopup="dialog" aria-controls="profileDialog">
        <span class="account-avatar" id="accountAvatar">{{ (user.display_name or user.email.split('@')[0])[:1]|upper }}</span>
        <span class="account-label"><strong id="accountName">{{ user.display_name or user.email.split('@')[0] }}</strong><small>{{ user.email }}</small></span>
        <span class="account-menu-mark" aria-hidden="true">•••</span>
      </button>
    </div>
  </div>

  <dialog class="profile-dialog" id="profileDialog" aria-labelledby="profileTitle">
    <form method="dialog" class="profile-dialog-head">
      <div><h2 id="profileTitle">Profile</h2><p>Manage your account details.</p></div>
      <button class="profile-close" aria-label="Close profile">×</button>
    </form>
    <form id="profileForm" class="profile-form">
      <label for="profileName">Name</label>
      <input id="profileName" name="name" maxlength="120" required value="{{ user.display_name or user.email.split('@')[0] }}">
      <label for="profileEmail">Email</label>
      <input id="profileEmail" type="email" readonly value="{{ user.email }}">
      <div id="profileError" class="profile-feedback" role="status"></div>
      <button class="profile-primary" type="submit">Save name</button>
    </form>
    <div class="profile-security">
      <h3>Password</h3>
      <p class="profile-password-note">Passwords are stored securely and can’t be viewed. You can set a new one here.</p>
      {% if not can_set_password %}
      <label for="currentPassword">Current password</label>
      <input id="currentPassword" type="password" autocomplete="current-password" placeholder="Current password">
      {% endif %}
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      <div id="passwordFeedback" class="profile-feedback" role="status"></div>
      <button class="profile-primary" id="passwordButton" type="button">Update password</button>
    </div>
    <div class="profile-signout">
      <button class="profile-signout-button" id="logoutButton" type="button">Sign out</button>
      <div id="logoutFeedback" class="profile-feedback" role="status"></div>
    </div>
  </dialog>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- Main -->
  <div class="main">
    <div class="main-header">
      <button id="sidebarOpen" class="sidebar-toggle" title="Open sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>

      <div class="bot-brand">
        <div class="bot-avatar">P</div>
        <div class="bot-brand-text">
          <div class="bot-name">
            <span class="status-dot"></span>
            Patrick
          </div>
          <div id="chatTitle" class="chat-title">New conversation</div>
        </div>
      </div>

      <div class="header-spacer"></div>

      <button id="themeToggleBtn" class="icon-btn" title="Toggle light / dark mode">
        <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg id="themeIconSun" class="is-hidden" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l-1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button id="voiceOutputBtn" class="icon-btn" title="Toggle voice replies">
        <svg id="voiceOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 5 6 9H3v6h3l5 4V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg id="voiceOnIcon" class="is-hidden" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 5 6 9H3v6h3l5 4V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="composer-wrap">
      <div id="attachmentPreview" class="attachment-preview is-hidden">
        <div class="attachment-chip">
          <div id="attachmentThumb" class="attachment-thumb">📎</div>
          <span id="attachmentName" class="attachment-name"></span>
          <button id="attachmentRemove" class="attachment-remove" title="Remove attachment">✕</button>
        </div>
      </div>
      <div class="composer">
        <input type="file" id="fileInput" accept="image/*,.txt,.md,.csv,.json,.js,.py,.html,.css,.log" hidden>
        <button id="attachBtn" class="composer-icon-btn" title="Attach a file or screenshot">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M17 7 8.5 15.5a3 3 0 0 0 4.24 4.24L20.5 12A5 5 0 0 0 13.5 5L6 12.5a1.5 1.5 0 0 0 2.12 2.12L15 7.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea id="userInput" rows="1" placeholder="Message Patrick..." autocomplete="off"></textarea>
        <button id="micBtn" class="composer-icon-btn" title="Speak your message">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="sendBtn" class="composer-icon-btn send-btn" title="Send">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="composer-hint">AI can make mistakes. Check important info.</div>
    </div>
  </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
