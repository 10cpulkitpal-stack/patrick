<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Patrick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
<main class="auth-page-card">
  <div class="auth-avatar">P</div>
  <h1>Create your account</h1>
  <p class="auth-subtitle">Your chats will be private to your account.</p>
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="auth-notice {{ category }}" role="status">{{ message }}</div>
  {% endfor %}
  <a class="google-signin" href="{{ url_for('google_login') }}">
    <svg aria-hidden="true" viewBox="0 0 48 48" width="20" height="20"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 3.08 13.22l7.98 6.19C12.95 13.72 18.03 9.5 24 9.5Z" transform="translate(0 4)"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.65 5.93c4.46-4.12 7.12-10.2 7.12-17.58Z"/><path fill="#FBBC05" d="M10.06 28.59A14.4 14.4 0 0 1 9.3 24c0-1.59.27-3.12.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.58 10.78l7.48-5.82Z" transform="translate(0 4)"/><path fill="#34A853" d="M24 48c6.48 0 11.94-2.13 15.92-5.87l-7.65-5.93c-2.13 1.43-4.87 2.3-8.27 2.3-5.97 0-11.05-4.22-12.94-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/></svg>
    <span>Continue with Google</span>
  </a>
  <div class="auth-divider"><span>or sign up with email</span></div>
  <form id="authForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
    <button type="submit">Create account</button>
    <div id="error" class="auth-error"></div>
  </form>
  <p class="auth-switch">Already have an account? <a href="/signin">Sign in</a></p>
</main>
<script>
const form=document.getElementById('authForm');
const error=document.getElementById('error');
form.addEventListener('submit',async(e)=>{
 e.preventDefault(); error.textContent='';
 const button=form.querySelector('button'); button.disabled=true; button.textContent='Creating...';
 try {
   const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
   const data=await res.json();
   if(!res.ok){error.textContent=data.error||'Unable to create account.';return;}
   window.location.href='/';
 } catch(err){error.textContent='Network error. Please try again.';}
 finally {button.disabled=false;button.textContent='Create account';}
});
</script>
</body>
</html>
